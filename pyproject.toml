[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-image-generator"
version = "0.1.1"
description = "MCP server for image generation via codex-proxy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "namelogen", email = "namelogen@gmail.com" },
]
keywords = ["mcp", "codex", "image-generation", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
]

[project.scripts]
codex-image-generator = "codex_image_generator.server:main"

[project.urls]
Homepage = "https://github.com/yourusername/codex-image-generator"
Issues = "https://github.com/yourusername/codex-image-generator/issues"
